name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve SmartCacheDB. Do not include credentials or sensitive cache data.
  - type: input
    id: version
    attributes:
      label: SmartCacheDB version
      placeholder: 0.1.8
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: 20.15.0
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Storage backend
      multiple: true
      options:
        - Memory
        - Redis
        - Database
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest code sample that demonstrates the problem.
      render: typescript
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
